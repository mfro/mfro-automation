esphome:
  name: mfro-ble-unlock

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf
    advanced:
      enable_full_printf: true

logger:
  level: DEBUG

network:
  enable_ipv6: true

# turn on wifi for setup with iphone
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password

openthread:
  device_type: FTD
  force_dataset: true
  output_power: 20
  tlv: !secret thread_tlv

api:
  encryption:
    key: !secret v1_api_key

ota:
  - platform: esphome
    password: v1_ota_key

external_components:
  source: components

ble_unlock:
  irk:
  - !secret irk_mfro_iphone12
  - !secret irk_mfro_apple_watch11

binary_sensor:
- platform: ble_unlock
  name: "ble_unlock auth"

safe_mode:
  disabled: true
